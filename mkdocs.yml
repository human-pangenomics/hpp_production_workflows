site_name: HPP Production Workflows
site_description: Assembly production pipeline and QC — verkko, TTT, Panpatch, and the full HPRC QC suite
repo_url: https://github.com/human-pangenomics/hpp_production_workflows
repo_name: human-pangenomics/hpp_production_workflows
edit_uri: edit/v3/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Data Processing: data_processing/index.md
  - Assembly Pipeline:
    - Overview: index.md
    - "1–3 · Download & Correction": assembly/correction.md
    - "4–5 · Verkko Assembly": assembly/verkko.md
    - "6 · verkko-fillet": assembly/verkko-fillet.md
    - "7 · TTT": assembly/ttt.md
    - "8 · Panpatch": assembly/panpatch.md
  - Assembly QC:
    - Overview: qc/index.md
    - "GQC": qc/gqc.md
    - "CenSat": qc/censat.md
    - "Compleasm": qc/compleasm.md
    - "T2T": qc/t2t.md
    - "Quaak": qc/quaak.md
    - "assembly_qc / Yak QV": qc/assembly-qc.md
    - "Flagger": qc/flagger.md
    - "NucFlag": qc/nucflag.md
  - References: references.md
